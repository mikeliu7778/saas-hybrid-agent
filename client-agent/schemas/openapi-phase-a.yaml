openapi: 3.0.3
info:
  title: Client Agent Control Plane API
  version: 0.1.0-phase-a
  description: |
    Phase A thin control plane: Auth/Devices, LLM gateway, embeddings, sync, quota, trust signals.
    Sync payloads are NOT E2E encrypted in Phase A (OD-1); E2E sync is optional/postponed (see trust design).
servers:
  - url: /
paths:
  /v1/devices:
    post:
      operationId: registerDevice
      summary: Register a device and obtain a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegisterRequest"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegisterResponse"
  /v1/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Revoke a device token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
        "401":
          description: Unauthorized
  /v1/llm/chat:
    post:
      operationId: llmChat
      summary: Chat completions via OpenAI-compatible upstream or Cursor sidecar (SSE)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmChatRequest"
      responses:
        "200":
          description: SSE stream of chat events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Unauthorized
        "400":
          description: |
            Multimodal validation (e.g. model lacks vision, image limit, unsupported MIME, image on non-user role).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                model_lacks_vision:
                  value:
                    code: model_lacks_vision
                    message: "model does not support vision: gpt-3.5-turbo"
                image_limit:
                  value:
                    code: image_limit
                    message: "at most 5 images are allowed per request"
        "429":
          description: Rate limited
  /v1/llm/embeddings:
    post:
      operationId: llmEmbeddings
      summary: Proxy embeddings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Embedding vectors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"
  /v1/llm/capabilities:
    get:
      operationId: llmCapabilities
      summary: Vision and other model capabilities for the effective model
      description: |
        Uses request `model` when provided, otherwise server default (`saas-hybrid-agent.llm.model`).
        `provider` is echoed in the response for client convenience; vision is determined by static model table only.
      security:
        - bearerAuth: []
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: Model name to query (defaults to configured chat model)
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum: [openai, cursor]
          description: Optional provider hint (returned as-is; does not change vision lookup)
      responses:
        "200":
          description: Capabilities for the effective model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmCapabilitiesResponse"
        "401":
          description: Unauthorized
  /v1/sync/push:
    post:
      operationId: syncPush
      summary: Upload mutation set (Phase A plaintext OK)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: integer
  /v1/sync/pull:
    get:
      operationId: syncPull
      summary: Pull mutations since cursor
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
            default: "0"
      responses:
        "200":
          description: Mutations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
  /v1/quota:
    get:
      operationId: getQuota
      summary: Current usage and limits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaResponse"
  /v1/trust/events:
    post:
      operationId: appendTrustEvents
      summary: Append trust signal events (idempotent on eventId)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEventsRequest"
      responses:
        "200":
          description: Batch processed; whole batch rejected with 400 if any event is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustEventsResponse"
        "400":
          description: Invalid batch (missing required fields or invalid signal)
        "401":
          description: Unauthorized
  /v1/trust/metrics:
    get:
      operationId: getTrustMetrics
      summary: Aggregate trust event counts by day
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: grain
          in: query
          required: false
          schema:
            type: string
            enum: [day]
            default: day
      responses:
        "200":
          description: Aggregated buckets (empty array when no events)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustMetricsResponse"
        "400":
          description: Unsupported grain (only day supported)
        "401":
          description: Unauthorized
  /v1/ingest/events:
    post:
      operationId: appendIngestAnalyticsEvents
      summary: Append ingest analytics events (metadata only; idempotent on eventId)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventsRequest"
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEventsResponse"
        "400":
          description: Invalid batch
        "401":
          description: Unauthorized
  /v1/ingest/metrics:
    get:
      operationId: getIngestMetrics
      summary: Aggregate ingest analytics by day (bySource / byKind)
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: grain
          in: query
          required: false
          schema:
            type: string
            enum: [day]
            default: day
      responses:
        "200":
          description: Aggregated buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestMetricsResponse"
        "400":
          description: Unsupported grain
        "401":
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DeviceRegisterRequest:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [web, ios, android]
    DeviceRegisterResponse:
      type: object
      required: [deviceId, token, userId]
      properties:
        deviceId:
          type: string
        token:
          type: string
        userId:
          type: string
    LlmChatRequest:
      type: object
      required: [messages]
      properties:
        provider:
          type: string
          enum: [openai, cursor]
          description: |
            LLM backend. Defaults to server `saas-hybrid-agent.llm.default-provider` (openai).
            When `cursor`, Java forwards to the local Python sidecar; request `tools` are ignored
            and responses do not include LLM `tool_call` events (client Hybrid tool loop requires openai).
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          items:
            type: object
          description: Tool schemas uploaded by client for this request
        stream:
          type: boolean
          default: true
        cursor:
          type: string
          description: Optional resume cursor / Last-Event-ID from a prior SSE event
    ContentPart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, image_url]
        text:
          type: string
        image_url:
          type: object
          properties:
            url:
              type: string
              description: data:image/...;base64,... or https://...
            detail:
              type: string
              enum: [auto, low, high]
    ChatMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
              nullable: true
            - type: array
              items:
                $ref: "#/components/schemas/ContentPart"
          description: |
            Plain string (legacy) or OpenAI-style content parts. Only `role=user` may include `image_url` parts
            (max 5 images, 4MB each, MIME png/jpeg/gif/webp).
        tool_calls:
          type: array
          items:
            type: object
        tool_call_id:
          type: string
        name:
          type: string
    LlmCapabilitiesResponse:
      type: object
      required: [vision, model]
      properties:
        vision:
          type: boolean
          description: Whether the effective model supports image inputs
        model:
          type: string
          description: Model name used for the lookup
        provider:
          type: string
          description: Echo of request provider query param (may be empty)
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
    EmbeddingRequest:
      type: object
      required: [input]
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    EmbeddingResponse:
      type: object
      required: [model, data]
      properties:
        model:
          type: string
        data:
          type: array
          items:
            type: object
            required: [embedding, index]
            properties:
              embedding:
                type: array
                items:
                  type: number
              index:
                type: integer
    SyncMutation:
      type: object
      required: [entityType, entityId, version, updatedAt, deviceId, payload]
      properties:
        entityType:
          type: string
          enum: [message, semantic, episode, procedural, session_meta]
        entityId:
          type: string
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        deviceId:
          type: string
        tombstone:
          type: boolean
        payload:
          type: object
          additionalProperties: true
        embedding:
          type: array
          items:
            type: number
        embeddingModelId:
          type: string
    SyncPushRequest:
      type: object
      required: [deviceId, mutations]
      properties:
        deviceId:
          type: string
        mutations:
          type: array
          items:
            $ref: "#/components/schemas/SyncMutation"
    SyncPullResponse:
      type: object
      required: [cursor, mutations]
      properties:
        cursor:
          type: string
        mutations:
          type: array
          items:
            $ref: "#/components/schemas/SyncMutation"
    QuotaResponse:
      type: object
      required: [llmTokensUsed, llmTokensLimit, embeddingCallsUsed, embeddingCallsLimit]
      properties:
        llmTokensUsed:
          type: integer
        llmTokensLimit:
          type: integer
        embeddingCallsUsed:
          type: integer
        embeddingCallsLimit:
          type: integer
    SseChatEvent:
      type: object
      description: Logical SSE payload shapes for /v1/llm/chat
      required: [type]
      properties:
        type:
          type: string
          enum: [delta, tool_call, error, done]
        text:
          type: string
        error:
          type: string
        finish_reason:
          type: string
        cursor:
          type: string
          description: Monotonic event cursor (also sent as SSE id)
    TrustEventDto:
      type: object
      required: [eventId, kind, target, targetId, signal, ts]
      properties:
        eventId:
          type: string
          description: Client-generated idempotency key
        deviceId:
          type: string
        accountId:
          type: string
        sessionId:
          type: string
        turnId:
          type: string
        kind:
          type: string
          description: e.g. explicit_message_feedback, implicit_followup
        target:
          type: string
          description: assistant_message, memory_item, tool_result, citation
        targetId:
          type: string
        signal:
          type: string
          enum: [trust, distrust, correct]
        strength:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        payload:
          type: object
          additionalProperties: true
        ts:
          type: string
          format: date-time
    TrustEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TrustEventDto"
    TrustEventsResponse:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer
    TrustMetricsResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/TrustMetricsBucket"
    TrustMetricsBucket:
      type: object
      required: [key, trust, distrust, correct, byKind]
      properties:
        key:
          type: string
          description: Date bucket key (YYYY-MM-DD when grain=day)
        trust:
          type: integer
        distrust:
          type: integer
        correct:
          type: integer
        byKind:
          type: object
          additionalProperties:
            type: integer
    IngestAnalyticsEventDto:
      type: object
      required: [eventId, source, kind, ts]
      properties:
        eventId:
          type: string
        source:
          type: string
        kind:
          type: string
        ts:
          type: string
          format: date-time
        deviceId:
          type: string
        nativeSessionId:
          type: string
        pathCount:
          type: integer
    IngestEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/IngestAnalyticsEventDto"
    IngestEventsResponse:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted:
          type: integer
        duplicates:
          type: integer
    IngestMetricsResponse:
      type: object
      required: [buckets]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/IngestMetricsBucket"
    IngestMetricsBucket:
      type: object
      required: [key, total, bySource, byKind]
      properties:
        key:
          type: string
        total:
          type: integer
        bySource:
          type: object
          additionalProperties:
            type: integer
        byKind:
          type: object
          additionalProperties:
            type: integer
