<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SaaS Hybrid Agent — Trust Demo</title>
    <!-- Run: cd client-agent && npm run demo:web → open http://localhost:5173/web/ -->
    <style>
      body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
      #log { border: 1px solid #ccc; min-height: 240px; padding: 0.75rem; white-space: pre-wrap; }
      .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; align-items: center; flex-wrap: wrap; }
      aside { border-left: 1px solid #ddd; padding-left: 1rem; }
      .layout { display: grid; grid-template-columns: 1fr 280px; gap: 1rem; }
      button { cursor: pointer; }
      .msg { margin: 0.5rem 0; padding: 0.4rem 0; border-bottom: 1px solid #eee; }
      .msg.user { color: #333; }
      .msg.assistant { color: #111; }
      .feedback { margin-left: 0.5rem; }
      .feedback button { margin-right: 0.25rem; }
      .meta { color: #666; font-size: 0.85rem; }
      #status { color: #444; font-size: 0.9rem; }
      #mem { list-style: none; padding: 0; }
      #mem li { margin: 0.4rem 0; font-size: 0.9rem; word-break: break-word; }
      #imagePreview { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.4rem 0; }
      #imagePreview .thumb { position: relative; width: 72px; height: 72px; }
      #imagePreview .thumb img, .msg img.thumb-img {
        width: 72px; height: 72px; object-fit: cover; border: 1px solid #ccc; display: block;
      }
      #imagePreview .thumb button {
        position: absolute; top: 0; right: 0; padding: 0 0.25rem; font-size: 0.75rem; line-height: 1.2;
      }
      #mcpHint code { font-size: 0.75rem; word-break: break-all; }
      #searchHits { list-style: none; padding: 0; margin: 0.25rem 0 0.75rem; max-height: 8rem; overflow: auto; }
      #searchHits li { margin: 0.25rem 0; font-size: 0.8rem; word-break: break-word; }
      @media (max-width: 720px) {
        .layout { grid-template-columns: 1fr; }
        aside { border-left: none; border-top: 1px solid #ddd; padding-left: 0; padding-top: 1rem; }
      }
    </style>
  </head>
  <body>
    <h1>Hybrid Agent</h1>
    <p>
      可交互演示：上传 Cursor / Continue / Aider 会话 → 写入个人 Memory → 搜索与对话召回。
      也可导出 MemoryPack 给 MCP 使用。
    </p>
    <div class="row">
      <input id="baseUrl" value="http://localhost:8080" size="40" />
      <label>
        Engine
        <select id="provider" title="openai keeps Hybrid tools; cursor is sidecar text-only">
          <option value="openai">openai (tools)</option>
          <option value="cursor">cursor (sidecar, no client tools)</option>
        </select>
      </label>
      <button id="register">注册设备</button>
      <button id="newSession" type="button">新会话</button>
      <label><input type="checkbox" id="reportTrust" checked /> 上报采信</label>
    </div>
    <p id="status" class="meta">未注册</p>
    <div class="layout">
      <main>
        <div id="log"></div>
        <div id="imagePreview"></div>
        <div class="row">
          <input id="msg" style="flex:1" placeholder="输入消息…" />
          <input type="file" id="imageFile" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
          <button id="attachImage" disabled>附图片</button>
          <button id="send">发送</button>
        </div>
      </main>
      <aside>
        <h3>个人 Memory</h3>
        <div class="row">
          <input id="memQuery" style="flex:1; min-width:8rem" placeholder="搜索 Memory…" disabled />
          <button id="memSearch" type="button" disabled>搜索</button>
        </div>
        <ul id="searchHits" class="meta"></ul>
        <div class="row">
          <button id="ingestSample" type="button" disabled>样例 Cursor</button>
          <button id="ingestUploadBtn" type="button" disabled>上传会话</button>
          <input type="file" id="ingestFile" accept=".jsonl,.json,.md,.txt,application/json,text/plain,text/markdown" hidden />
        </div>
        <div class="row">
          <button id="exportPack" type="button" disabled>导出 Pack</button>
          <button id="importPackBtn" type="button" disabled>导入 Pack</button>
          <input type="file" id="importPackFile" accept=".json,application/json" hidden />
        </div>
        <p id="mcpHint" class="meta">
          MCP：导出 Pack 后执行<br />
          <code>HYBRID_MEMORY_PACK=/path/to/pack.json npm run mcp</code>
        </p>
        <h4 class="meta">Semantic</h4>
        <ul id="mem"></ul>
        <h4 class="meta">Episodes (ingest)</h4>
        <ul id="epi"></ul>
        <h4 class="meta">Workspace hints</h4>
        <ul id="ws"></ul>
      </aside>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
