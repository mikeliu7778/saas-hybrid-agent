<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SaaS Hybrid Agent — Trust Demo</title>
    <!-- Run: cd client-agent && npm run demo:web → open http://localhost:5173/web/ -->
    <style>
      body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1rem auto; padding: 0 1rem; }
      #log { border: 1px solid #ccc; min-height: 240px; padding: 0.75rem; white-space: pre-wrap; }
      .row { display: flex; gap: 0.5rem; margin: 0.5rem 0; align-items: center; flex-wrap: wrap; }
      aside { border-left: 1px solid #ddd; padding-left: 1rem; }
      .layout { display: grid; grid-template-columns: 1fr 280px; gap: 1rem; }
      button { cursor: pointer; }
      .msg { margin: 0.5rem 0; padding: 0.4rem 0; border-bottom: 1px solid #eee; }
      .msg.user { color: #333; }
      .msg.assistant { color: #111; }
      .feedback { margin-left: 0.5rem; }
      .feedback button { margin-right: 0.25rem; }
      .meta { color: #666; font-size: 0.85rem; }
      #status { color: #444; font-size: 0.9rem; }
      #mem { list-style: none; padding: 0; }
      #mem li { margin: 0.4rem 0; font-size: 0.9rem; word-break: break-word; }
      #imagePreview { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.4rem 0; }
      #imagePreview .thumb { position: relative; width: 72px; height: 72px; }
      #imagePreview .thumb img, .msg img.thumb-img {
        width: 72px; height: 72px; object-fit: cover; border: 1px solid #ccc; display: block;
      }
      #imagePreview .thumb button {
        position: absolute; top: 0; right: 0; padding: 0 0.25rem; font-size: 0.75rem; line-height: 1.2;
      }
      @media (max-width: 720px) {
        .layout { grid-template-columns: 1fr; }
        aside { border-left: none; border-top: 1px solid #ddd; padding-left: 0; padding-top: 1rem; }
      }
    </style>
  </head>
  <body>
    <h1>Hybrid Agent</h1>
    <p>可交互演示：对话 + 显式采信 + Memory 删除（非写死脚本）。</p>
    <div class="row">
      <input id="baseUrl" value="http://localhost:8080" size="40" />
      <label>
        LLM
        <select id="provider">
          <option value="openai">openai</option>
          <option value="cursor">cursor</option>
        </select>
      </label>
      <button id="register">注册设备</button>
      <button id="newSession" type="button">新会话</button>
      <label><input type="checkbox" id="reportTrust" checked /> 上报采信</label>
    </div>
    <p id="status" class="meta">未注册</p>
    <div class="layout">
      <main>
        <div id="log"></div>
        <div id="imagePreview"></div>
        <div class="row">
          <input id="msg" style="flex:1" placeholder="输入消息…" />
          <input type="file" id="imageFile" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden />
          <button id="attachImage" disabled>附图片</button>
          <button id="send">发送</button>
        </div>
      </main>
      <aside>
        <h3>Memory</h3>
        <ul id="mem"></ul>
      </aside>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
