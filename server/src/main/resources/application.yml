spring:
  application:
    name: saas-hybrid-agent
  ai:
    openai:
      api-key: ${SAAS_HYBRID_AGENT_API_KEY:test-key}
      base-url: ${SAAS_HYBRID_AGENT_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SAAS_HYBRID_AGENT_MODEL:gpt-4o-mini}

saas-hybrid-agent:
  llm:
    default-provider: ${SAAS_HYBRID_AGENT_LLM_PROVIDER:openai}
    cursor-sidecar-url: ${CURSOR_SIDECAR_URL:http://127.0.0.1:8091}
  control-plane:
    quota:
      llm-tokens-limit: 1000000
      embedding-calls-limit: 10000
    rate-limit:
      chat-requests-per-window: 1000
